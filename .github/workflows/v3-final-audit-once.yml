name: Final v3 audit once
on:
  push:
    branches: [research/platonic-energy-operators]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: research/platonic-energy-operators
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[dev]
      - name: Regenerate msdmd and capture pytest
        shell: bash
        run: |
          set +e
          python tools/generate_msdmd.py
          python -m pytest -q > .v3-pytest.log 2>&1
          status=$?
          echo "$status" > .v3-pytest.status
          rm -f .github/workflows/v3-final-audit-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'build: regenerate v3 metadata and capture final audit'
          git push origin HEAD:research/platonic-energy-operators
          exit 0

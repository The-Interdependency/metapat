name: Regenerate v3 application fixtures once
on:
  push:
    branches: [research/platonic-energy-operators]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: research/platonic-energy-operators
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[dev]
      - name: Regenerate application fixtures
        run: |
          python tools/generate_application_fixtures.py
          rm -f src/metapat/fixtures/quantum-magnetism-application-v2.json
          rm -f src/metapat/fixtures/three-phase-electromagnetic-pipe-v2.json
          rm -f .github/workflows/v3-regenerate-app-fixtures-once.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'build: generate metapat v3 application fixtures'
          git push origin HEAD:research/platonic-energy-operators

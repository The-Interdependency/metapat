name: temporary-metapat-msdmd-regeneration

on:
  push:
    branches:
      - feat/structural-recurrence-v0

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/structural-recurrence-v0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Regenerate bounded MSDMD collection
        run: python tools/generate_msdmd.py
      - name: Commit generated projection only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metapat_msdmd.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(msdmd): regenerate METAPAT collection"
          git push origin HEAD:feat/structural-recurrence-v0

name: Regenerate msdmd once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/regenerate-msdmd-once.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Regenerate collection
        run: python tools/generate_msdmd.py
      - name: Commit generated collection
        run: |
          if git diff --quiet -- metapat_msdmd.ts; then
            echo "metapat_msdmd.ts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metapat_msdmd.ts
          git commit -m "meta: regenerate msdmd collection"
          git push origin HEAD:main

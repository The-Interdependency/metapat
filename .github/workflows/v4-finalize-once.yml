name: Finalize v4 migration once
on:
  push:
    branches: [canon/v4-domain-qualified-energy]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: canon/v4-domain-qualified-energy
      - uses: actions/setup-python@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          python-version: '3.12'
      - name: Migrate exact v4 consumers
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              if count is not None and s.count(old) != count:
                  raise SystemExit(f'unexpected occurrence count in {path}: {old!r} => {s.count(old)} != {count}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          # Generator outputs and application epochs.
          for path in ('tools/generate_catalog.py',):
              replace(path, 'root-spine-envelope-v3', 'root-spine-envelope-v4')
              replace(path, 'semantic-module-catalog-v3', 'semantic-module-catalog-v4')
          replace('tools/generate_application_fixtures.py', 'quantum-magnetism-application-v3', 'quantum-magnetism-application-v4')
          replace('tools/generate_application_fixtures.py', 'three-phase-electromagnetic-pipe-v3', 'three-phase-electromagnetic-pipe-v4')
          replace('src/metapat/quantum_magnetism.py', 'canonical semantic catalog v2', 'canonical semantic catalog v4')
          replace('src/metapat/quantum_magnetism.py', 'quantum-magnetism-application-v3', 'quantum-magnetism-application-v4')
          replace('src/metapat/electromagnetic_pipe.py', 'deterministic fixture in metapat 0.7.0', 'deterministic fixture in metapat 0.8.0')
          replace('src/metapat/electromagnetic_pipe.py', 'canonical semantic catalog v2', 'canonical semantic catalog v4')
          replace('src/metapat/electromagnetic_pipe.py', 'three-phase-electromagnetic-pipe-application-v3', 'three-phase-electromagnetic-pipe-application-v4')
          replace('src/metapat/affixiation_harmonics.py', 'canonical semantic catalog v2', 'canonical semantic catalog v4')
          replace('src/metapat/affixiation_harmonics.py', 'affixiation-harmonics-application-v2', 'affixiation-harmonics-application-v3')

          # Human-facing current-epoch docs. Historical release/synthesis records are intentionally untouched.
          replace('docs/application-modules.md', 'quantum-magnetism-application-v3', 'quantum-magnetism-application-v4')
          replace('docs/application-modules.md', 'three-phase-electromagnetic-pipe-v3', 'three-phase-electromagnetic-pipe-v4')
          replace('docs/application-modules.md', 'current v3 bindings', 'current v4 bindings')
          replace('docs/semantic-module-catalog.md', '# METAPAT semantic module catalog v3', '# METAPAT semantic module catalog v4')
          replace('docs/semantic-module-catalog.md', 'metapat-semantic-catalog-v3', 'metapat-semantic-catalog-v4')
          replace('docs/semantic-module-catalog.md', 'metapat-canon-v3', 'metapat-canon-v4')
          replace('docs/semantic-module-catalog.md', 'root-spine-envelope-v3.json', 'root-spine-envelope-v4.json')
          replace('docs/semantic-module-catalog.md', 'semantic-module-catalog-v3.json', 'semantic-module-catalog-v4.json')

          # README: current doctrine/epochs only.
          replace('README.md',
              'METAPAT is the canonical semantic authority for Meta Energy Theory. It reconstructs Platonic energy from structures and actions exposed across domains without allowing any one domain to own the root.\n\nEvery domain exposes some properties of Platonic energy. No domain exposes all of them.',
              'METAPAT is the canonical semantic authority for Meta Energy Theory. It compares structures and actions independently exposed across domains without allowing any one domain to own the root or transfer its vocabulary by resemblance alone.\n\nDifferent domains may expose common structures and actions. Domain-specific names, mechanisms, evidence standards, and conservation laws remain domain-owned unless the target domain independently licenses them.')
          replace('README.md',
              'Time is sequential transformation.\nEnergy is vectors altering state through transformation across time.\n```\n\nEnergy is therefore derived rather than primitive at this level.',
              'Time is sequential transformation.\nStructural recurrence does not transfer a domain term.\n```\n\nEnergy is domain-qualified: METAPAT does not call every state transformation energy merely because energetic systems can share the same abstract structure.')
          replace('README.md', 'metapat-canon-v3', 'metapat-canon-v4')
          replace('README.md', 'root-spine-envelope-v3.json', 'root-spine-envelope-v4.json')
          replace('README.md', 'metapat-semantic-catalog-v3', 'metapat-semantic-catalog-v4')
          replace('README.md', 'semantic-module-catalog-v3.json', 'semantic-module-catalog-v4.json')
          replace('README.md', 'quantum-magnetism-application-v3', 'quantum-magnetism-application-v4')
          replace('README.md', 'Consumers pinned to any prior canon/catalog must fail closed until explicitly migrated to v3 identities.', 'Consumers pinned to any prior canon/catalog must fail closed until explicitly migrated to v4 identities.')

          # Agent-facing current doctrine.
          replace('AGENTS.md', 'Preserve exact v3 canon', 'Preserve exact v4 canon')
          replace('AGENTS.md',
              'Canon v3 derives energy from prior structure and action rather than assuming energy-state as primitive. Every domain exposes some properties of Platonic energy; no domain exposes all. Catalog v3 makes the current root, axiom, postulate, theorem, and theory surfaces addressable without transferring domain, measurement, theorem, or UCNS validity.',
              'Canon v4 preserves the structure/action root through time and makes domain qualification explicit: structural resemblance does not transfer a domain term, mechanism, evidence standard, or conservation law. Catalog v4 makes the current root, axiom, postulate, theorem, and theory surfaces addressable without transferring domain, measurement, theorem, or UCNS validity.')
          replace('AGENTS.md', '#   energy: Vectors altering state through transformation across time.', '#   energy: Domain-qualified; METAPAT does not call every state transformation energy.')
          replace('AGENTS.md', '#   semantic_catalog_v3: 40 ordered doctrine modules and 43 exact source-declared derived-from relations bound to metapat-canon-v3.', '#   semantic_catalog_v4: 40 ordered doctrine modules and 43 exact source-declared derived-from relations bound to metapat-canon-v4.')
          replace('AGENTS.md', 'Tensor is not primitive in v3', 'Tensor is not primitive in v4')
          replace('AGENTS.md', 'Use exact v3 catalog module IDs', 'Use exact v4 catalog module IDs')
          replace('AGENTS.md', 'Catalog v3 remains exactly', 'Catalog v4 remains exactly')
          replace('AGENTS.md', 'migrated to v3 identities', 'migrated to v4 identities')
          replace('AGENTS.md',
              'Time is sequential transformation.\nEnergy is vectors altering state through transformation across time.\n```\n\nEnergy is derived rather than primitive.',
              'Time is sequential transformation.\nStructural recurrence does not transfer a domain term.\n```\n\nEnergy is domain-qualified rather than a universal name for state transformation.')
          replace('AGENTS.md', '- Every domain exposes some properties of Platonic energy; no domain exposes all.', '- Different domains may independently expose common structures/actions; resemblance alone transfers no domain-specific name or mechanism.')
          replace('AGENTS.md', 'Catalog v3 makes current doctrine addressable', 'Catalog v4 makes current doctrine addressable')

          # Compliance surface.
          replace('COMPLIANCE.md', 'Date: 2026-09-13', 'Date: 2026-09-15')
          replace('COMPLIANCE.md', 'root-spine-envelope-v3.json', 'root-spine-envelope-v4.json')
          replace('COMPLIANCE.md', 'semantic-module-catalog-v3.json', 'semantic-module-catalog-v4.json')
          replace('COMPLIANCE.md', 'packaged v3 application fixtures', 'packaged v4 application fixtures')
          replace('COMPLIANCE.md', 'version, typing marker, v3 fixtures', 'version, typing marker, v4 fixtures')
          replace('COMPLIANCE.md', 'metapat-canon-v3', 'metapat-canon-v4')
          replace('COMPLIANCE.md',
              'Time is sequential transformation.\nEnergy is vectors altering state through transformation across time.\n```\n\nTensor is not primitive before simplex in v3. Scalar is not state. Energy-state is not a root primitive. Energy is derived.',
              'Time is sequential transformation.\nStructural recurrence does not transfer a domain term.\n```\n\nTensor is not primitive before simplex in v4. Scalar is not state. Energy-state is not a root primitive. Energy is domain-qualified rather than a universal name for state transformation.')
          replace('COMPLIANCE.md', 'metapat-semantic-catalog-v3', 'metapat-semantic-catalog-v4')
          replace('COMPLIANCE.md', 'exact v3 catalog identities', 'exact v4 catalog identities')
          replace('COMPLIANCE.md',
              'Every domain exposes some properties of Platonic energy. No domain exposes all.\n\nA candidate shared structure/action survives only while independent domain comparisons fail to add, split, refine, or falsify it. Similarity alone is insufficient; domain-specific implementation must be removed before transfer is claimed.',
              'Different domains may independently expose common structures and actions. A candidate survives only while independent domain comparisons fail to add, split, refine, or falsify it. Similarity alone is insufficient; domain-specific implementation and vocabulary must be removed before structural transfer is claimed, and domain terms require independent target-domain license.')

          # Claims ledger: current identifiers/status claims only.
          replace('docs/claims-ledger.md', 'exact importable v3 canon', 'exact importable v4 canon')
          replace('docs/claims-ledger.md', '`energy_is_derived`', '`domain_term_is_qualified`')
          replace('docs/claims-ledger.md', 'Vector, state, transformation, and time are all required by the encoded condition.', 'A domain term is accepted only when the applicable domain independently licenses it; structural similarity alone is insufficient.')
          replace('docs/claims-ledger.md', 'metapat-canon-v3', 'metapat-canon-v4')
          replace('docs/claims-ledger.md', 'metapat-semantic-catalog-v3', 'metapat-semantic-catalog-v4')

          # Current CI/test fixture names and package version expectations.
          for path in ('.github/workflows/ci.yml', 'tests/test_catalog.py', 'tests/test_envelope.py', 'tests/test_packaging.py', 'tests/test_quantum_magnetism.py', 'tests/test_electromagnetic_pipe.py'):
              p = Path(path)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace('root-spine-envelope-v3.json', 'root-spine-envelope-v4.json')
              s = s.replace('semantic-module-catalog-v3.json', 'semantic-module-catalog-v4.json')
              s = s.replace('quantum-magnetism-application-v3.json', 'quantum-magnetism-application-v4.json')
              s = s.replace('three-phase-electromagnetic-pipe-v3.json', 'three-phase-electromagnetic-pipe-v4.json')
              s = s.replace('metapat-canon-v3', 'metapat-canon-v4')
              s = s.replace('metapat-semantic-catalog-v3', 'metapat-semantic-catalog-v4')
              s = s.replace('quantum-magnetism-application-v3', 'quantum-magnetism-application-v4')
              s = s.replace('three-phase-electromagnetic-pipe-application-v3', 'three-phase-electromagnetic-pipe-application-v4')
              s = s.replace('== "0.7.0"', '== "0.8.0"')
              s = s.replace('== "metapat-canon-v3"', '== "metapat-canon-v4"')
              p.write_text(s, encoding='utf-8')

          # Remove superseded generated v3 fixtures; generators will produce v4.
          for name in (
              'src/metapat/fixtures/root-spine-envelope-v3.json',
              'src/metapat/fixtures/semantic-module-catalog-v3.json',
              'src/metapat/fixtures/quantum-magnetism-application-v3.json',
              'src/metapat/fixtures/three-phase-electromagnetic-pipe-v3.json',
          ):
              p = Path(name)
              if p.exists():
                  p.unlink()

      - name: Install package and regenerate derived surfaces
        run: |
          python -m pip install -e .[dev]
          python tools/generate_catalog.py
          python tools/generate_application_fixtures.py
          python tools/generate_msdmd.py
      - name: Verify v4
        run: |
          python -m pytest -q
          python -m unittest discover -s tests
          python tools/check_contract_graph.py
          python tools/generate_catalog.py --check
          python tools/generate_application_fixtures.py --check
          python tools/generate_msdmd.py --check
          python -c "from pathlib import Path; import metapat; metapat.assert_canon_files_match(Path('.')); metapat.assert_catalog_complete(metapat.canonical_semantic_catalog()); metapat.assert_catalog_sources_match(Path('.'))"
      - name: Remove one-time workflow and commit verified migration
        run: |
          rm -f .github/workflows/v4-finalize-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'canon: complete v4 domain-qualification migration'
          git push origin HEAD:canon/v4-domain-qualified-energy

name: Migrate v3 application bindings once

on:
  push:
    branches:
      - research/platonic-energy-operators

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: research/platonic-energy-operators
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Migrate live v2 consumers to v3 identities
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected {old!r} at least {minimum} time(s), found {count}")
              p.write_text(text.replace(old, new))

          # Quantum-magnetism application: bind the same bounded physics use to v3 doctrine.
          qfiles = ["src/metapat/quantum_magnetism.py", "docs/applications/quantum-magnetism.md"]
          qmap = {
              "metapat.axiom.0.root_untouchable": "metapat.root_spine",
              "metapat.postulate.1.domain_similarity": "metapat.postulate.1.partial_domains",
              "metapat.axiom.4.tensor": "metapat.axiom.5.tensor",
              "metapat.axiom.6.relation": "metapat.axiom.6.relate",
              "metapat.axiom.7.gradient": "metapat.axiom.9.scalar",
              "metapat.axiom.2.boundary": "metapat.axiom.2.boundary",
              "metapat.axiom.5.energy_state": "metapat.axiom.3.state",
              "metapat.axiom.8.transformation": "metapat.axiom.10.transformation",
              "metapat.theory.2.boundary_mediated_transformation": "metapat.theory.1.thing_boundary_state",
              "metapat.theory.5.relational_gradient_selection": "metapat.theory.4.state_measurement",
              "metapat.theory.11.cross_domain_question_forms": "metapat.theory.11.cross_domain_reconstruction",
          }
          for path in qfiles:
              for old, new in qmap.items():
                  if old != new:
                      replace(path, old, new)
          replace("src/metapat/quantum_magnetism.py", 'QUANTUM_MAGNETISM_APPLICATION_VERSION = "quantum-magnetism-application-v2"', 'QUANTUM_MAGNETISM_APPLICATION_VERSION = "quantum-magnetism-application-v3"')
          replace("docs/applications/quantum-magnetism.md", "quantum-magnetism-application-v2.json", "quantum-magnetism-application-v3.json")
          replace("src/metapat/quantum_magnetism.py", '"gradient",\n        "Readable potential difference within those relations."', '"state-metric-difference",\n        "Readable potential difference is treated as a measured difference among related states."')
          replace("docs/applications/quantum-magnetism.md", "| `metapat.axiom.9.scalar` | gradient | Readable potential difference within those relations. |", "| `metapat.axiom.9.scalar` | state-metric-difference | Readable potential difference is treated as a measured difference among related states. |")
          replace("src/metapat/quantum_magnetism.py", '"energy-state",\n        "An allowed electronic state or collective magnetic state within the application model."', '"state",\n        "An allowed electronic state or collective magnetic state within the application model."')
          replace("docs/applications/quantum-magnetism.md", "| `metapat.axiom.3.state` | energy-state |", "| `metapat.axiom.3.state` | state |")
          replace("src/metapat/quantum_magnetism.py", '"boundary-mediated-transformation",\n        "Changing a modeled boundary state may change passage, permitted state selection, delay, filtering, propagation, or transformation outcome."', '"thing-boundary-state",\n        "Modeled physical boundaries participate in defining the selected physical things and states; their physical effects remain domain evidence."')
          replace("docs/applications/quantum-magnetism.md", "| `metapat.theory.1.thing_boundary_state` | boundary-mediated-transformation | Changing a modeled boundary state may change passage, permitted state selection, delay, filtering, propagation, or transformation outcome. |", "| `metapat.theory.1.thing_boundary_state` | thing-boundary-state | Modeled physical boundaries participate in defining the selected physical things and states; their physical effects remain domain evidence. |")
          replace("src/metapat/quantum_magnetism.py", '"relational-gradient-selection",\n        "Direction and state selection are asked through the complete relation, boundary state, and tensor arrangement rather than difference alone."', '"state-measurement",\n        "Direction and state selection are tested through measured state change rather than inferred from one unmeasured difference alone."')
          replace("docs/applications/quantum-magnetism.md", "| `metapat.theory.4.state_measurement` | relational-gradient-selection | Direction and state selection are asked through the complete relation, boundary state, and tensor arrangement rather than difference alone. |", "| `metapat.theory.4.state_measurement` | state-measurement | Direction and state selection are tested through measured state change rather than inferred from one unmeasured difference alone. |")

          # Affixiation/harmonics application.
          afiles = ["src/metapat/affixiation_harmonics.py", "docs/applications/affixiation-harmonics.md"]
          amap = {
              "metapat.axiom.0.root_untouchable": "metapat.root_spine",
              "metapat.postulate.1.domain_similarity": "metapat.postulate.1.partial_domains",
              "metapat.axiom.4.tensor": "metapat.axiom.5.tensor",
              "metapat.axiom.6.relation": "metapat.axiom.6.relate",
              "metapat.axiom.9.time": "metapat.axiom.11.time",
              "metapat.postulate.3.formed_objects": "metapat.postulate.3.recursive_closure",
              "metapat.postulate.4.integration": "metapat.theory.8.emergence",
              "metapat.theory.3.tensor_first_arrangement": "metapat.theory.2.relational_tensor_formation",
              "metapat.theory.5.relational_gradient_selection": "metapat.theory.4.state_measurement",
              "metapat.theory.6.time_as_sequential_tensor_alteration": "metapat.theory.6.time",
              "metapat.theory.9.native_scale_object_integration": "metapat.theory.3.recursive_closure",
              "metapat.theory.11.cross_domain_question_forms": "metapat.theory.11.cross_domain_reconstruction",
          }
          for path in afiles:
              for old, new in amap.items():
                  replace(path, old, new)
          replace("src/metapat/affixiation_harmonics.py", 'AFFIXIATION_HARMONICS_APPLICATION_VERSION = "affixiation-harmonics-application-v1"', 'AFFIXIATION_HARMONICS_APPLICATION_VERSION = "affixiation-harmonics-application-v2"')
          for path in afiles:
              replace(path, "Time remains sequential tensor alteration", "Time remains sequential transformation")
              replace(path, "time is sequential tensor alteration", "time is sequential transformation")
          replace("src/metapat/affixiation_harmonics.py", '"integration",\n        "Affixiation may integrate a declared relation as a higher-scale object-whole while retaining the addressable identities of its participants."', '"emergence",\n        "A tensor may emerge from related simplexes while retaining the addressable identities of its participants."')
          replace("docs/applications/affixiation-harmonics.md", "| `metapat.theory.8.emergence` | integration | Affixiation may integrate a declared relation as a higher-scale object-whole while retaining the addressable identities of its participants. |", "| `metapat.theory.8.emergence` | emergence | A tensor may emerge from related simplexes while retaining the addressable identities of its participants. |")

          # Electromagnetic-pipe application: preserve engineering claims but rebind them to v3 semantics.
          pfiles = ["src/metapat/electromagnetic_pipe.py", "docs/applications/three-phase-electromagnetic-pipe.md"]
          pmap = {
              "metapat.axiom.0.root_untouchable": "metapat.root_spine",
              "metapat.axiom.1.legible_difference": "metapat.axiom.1.thing",
              "metapat.axiom.2.boundary": "metapat.axiom.2.boundary",
              "metapat.axiom.4.tensor": "metapat.axiom.5.tensor",
              "metapat.axiom.5.energy_state": "metapat.axiom.3.state",
              "metapat.axiom.6.relation": "metapat.axiom.6.relate",
              "metapat.axiom.7.gradient": "metapat.axiom.9.scalar",
              "metapat.axiom.8.transformation": "metapat.axiom.10.transformation",
              "metapat.axiom.9.time": "metapat.axiom.11.time",
              "metapat.axiom.10.registration": "metapat.postulate.4.registration_plurality",
              "metapat.axiom.11.question": "metapat.theory.10.questions_unresolved_structure",
              "metapat.postulate.6.validation_by_boundary_change": "metapat.postulate.6.cross_domain_falsification",
              "metapat.theorem.1.boundary_earns_its_keep": "metapat.theorem.8.root_tool_separation",
              "metapat.theory.2.boundary_mediated_transformation": "metapat.theory.1.thing_boundary_state",
              "metapat.theory.5.relational_gradient_selection": "metapat.theory.4.state_measurement",
              "metapat.theory.6.time_as_sequential_tensor_alteration": "metapat.theory.6.time",
              "metapat.theory.7.registration_and_observer_roles": "metapat.theory.9.registration_observer",
              "metapat.theory.8.questions_as_bounded_unresolved_energy_state": "metapat.postulate.7.discovery_before_recovery",
              "metapat.theory.11.cross_domain_question_forms": "metapat.theory.11.cross_domain_reconstruction",
          }
          for path in pfiles:
              for old, new in pmap.items():
                  replace(path, old, new)
          replace("src/metapat/electromagnetic_pipe.py", 'PIPE_APPLICATION_VERSION = "three-phase-electromagnetic-pipe-application-v2"', 'PIPE_APPLICATION_VERSION = "three-phase-electromagnetic-pipe-application-v3"')
          for path in pfiles:
              replace(path, "sequential tensor alterations", "sequential transformations")
          replace("src/metapat/electromagnetic_pipe.py", '"energy-state", "Phase-current, magnetic-field, magnetization, motion, eddy-current, and thermal conditions are distinct energy-state surfaces."', '"state", "Phase-current, magnetic-field, magnetization, motion, eddy-current, and thermal conditions are distinct state surfaces."')
          replace("docs/applications/three-phase-electromagnetic-pipe.md", "| `metapat.axiom.3.state` | energy-state | Phase-current, magnetic-field, magnetization, motion, eddy-current, and thermal conditions are distinct energy-state surfaces. |", "| `metapat.axiom.3.state` | state | Phase-current, magnetic-field, magnetization, motion, eddy-current, and thermal conditions are distinct state surfaces. |")
          replace("src/metapat/electromagnetic_pipe.py", '"gradient", "Readable differences include field amplitude, field phase, position, temperature, magnetization, force, leakage, and shielding response."', '"state-metrics", "Measured differences include field amplitude, field phase, position, temperature, magnetization, force, leakage, and shielding response."')
          replace("docs/applications/three-phase-electromagnetic-pipe.md", "| `metapat.axiom.9.scalar` | gradient | Readable differences include field amplitude, field phase, position, temperature, magnetization, force, leakage, and shielding response. |", "| `metapat.axiom.9.scalar` | state-metrics | Measured differences include field amplitude, field phase, position, temperature, magnetization, force, leakage, and shielding response. |")
          replace("src/metapat/electromagnetic_pipe.py", '"boundary-test", "A claimed boundary effect must be tested by changing boundary state while holding declared source and target conditions as constant as practicable."', '"falsification-test", "A claimed boundary effect remains domain evidence and must survive controlled attempts to falsify it."')
          replace("docs/applications/three-phase-electromagnetic-pipe.md", "| `metapat.postulate.6.cross_domain_falsification` | boundary-test | A claimed boundary effect must be tested by changing boundary state while holding declared source and target conditions as constant as practicable. |", "| `metapat.postulate.6.cross_domain_falsification` | falsification-test | A claimed boundary effect remains domain evidence and must survive controlled attempts to falsify it. |")
          replace("src/metapat/electromagnetic_pipe.py", '"boundary-evidence", "Ceramic, iron, gap, end-return, and attractor boundaries earn model force only when their controlled change alters measured direction, delay, filtering, propagation, shielding, or transformation."', '"domain-evidence", "Physical effects attributed to ceramic, iron, gap, end-return, and attractor boundaries remain answerable to controlled domain evidence."')
          replace("docs/applications/three-phase-electromagnetic-pipe.md", "| `metapat.theorem.8.root_tool_separation` | boundary-evidence | Ceramic, iron, gap, end-return, and attractor boundaries earn model force only when their controlled change alters measured direction, delay, filtering, propagation, shielding, or transformation. |", "| `metapat.theorem.8.root_tool_separation` | domain-evidence | Physical effects attributed to ceramic, iron, gap, end-return, and attractor boundaries remain answerable to controlled domain evidence. |")

          # Generated fixture/version surfaces.
          replace("tools/generate_application_fixtures.py", "quantum-magnetism-application-v2.json", "quantum-magnetism-application-v3.json")
          replace("tools/generate_application_fixtures.py", "three-phase-electromagnetic-pipe-v2.json", "three-phase-electromagnetic-pipe-v3.json")
          replace("tests/test_packaging.py", "root-spine-envelope-v2.json", "root-spine-envelope-v3.json")
          replace("tests/test_packaging.py", "root-spine-envelope-v1.json", "root-spine-envelope-v2.json")
          replace("tests/test_packaging.py", "three-phase-electromagnetic-pipe-v2.json", "three-phase-electromagnetic-pipe-v3.json")
          replace("tests/test_packaging.py", "three-phase-electromagnetic-pipe-v1.json", "three-phase-electromagnetic-pipe-v2.json")

          # Update tests/docs that name application versions or v2 fixture names.
          for path in ["tests/test_quantum_magnetism.py", "tests/test_electromagnetic_pipe.py", "README.md", "COMPLIANCE.md", "AGENTS.md", "docs/application-modules.md", "docs/semantic-module-catalog.md"]:
              p = Path(path)
              if not p.exists():
                  continue
              text = p.read_text()
              text = text.replace("quantum-magnetism-application-v2", "quantum-magnetism-application-v3")
              text = text.replace("quantum-magnetism-application-v2.json", "quantum-magnetism-application-v3.json")
              text = text.replace("three-phase-electromagnetic-pipe-v2.json", "three-phase-electromagnetic-pipe-v3.json")
              text = text.replace("root-spine-envelope-v2.json", "root-spine-envelope-v3.json")
              text = text.replace("semantic-module-catalog-v2.json", "semantic-module-catalog-v3.json")
              text = text.replace("metapat-semantic-catalog-v2", "metapat-semantic-catalog-v3")
              text = text.replace("metapat-canon-v2", "metapat-canon-v3")
              p.write_text(text)

          # CI uses current fixture names only.
          p = Path(".github/workflows/ci.yml")
          text = p.read_text().replace("root-spine-envelope-v2.json", "root-spine-envelope-v3.json").replace("semantic-module-catalog-v2.json", "semantic-module-catalog-v3.json").replace("quantum-magnetism-application-v2.json", "quantum-magnetism-application-v3.json").replace("three-phase-electromagnetic-pipe-v2.json", "three-phase-electromagnetic-pipe-v3.json")
          p.write_text(text)

          # Remove this one-shot workflow after migration.
          Path(".github/workflows/v3-migrate-apps-once.yml").unlink()
      - name: Commit migrations
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'migration: bind live applications to metapat v3'
          git push origin HEAD:research/platonic-energy-operators

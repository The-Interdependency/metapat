name: Regenerate v3 fixtures once

on:
  push:
    branches:
      - research/platonic-energy-operators

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: research/platonic-energy-operators
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .[dev]
      - name: Generate current semantic fixtures
        run: |
          python tools/generate_catalog.py
          rm -f src/metapat/fixtures/root-spine-envelope-v2.json
          rm -f src/metapat/fixtures/semantic-module-catalog-v2.json
          rm -f .github/workflows/v3-regenerate-once.yml
      - name: Commit generated fixture rotation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'build: generate metapat v3 semantic fixtures'
          git push origin HEAD:research/platonic-energy-operators

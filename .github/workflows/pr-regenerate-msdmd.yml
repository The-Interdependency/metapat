name: PR regenerate msdmd

on:
  pull_request:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Regenerate exact msdmd collection
        run: python tools/generate_msdmd.py
      - name: Commit generated collection when stale
        run: |
          if git diff --quiet -- metapat_msdmd.ts; then
            echo "metapat_msdmd.ts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metapat_msdmd.ts
          git commit -m "Regenerate METAPAT msdmd collection"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
